# CloudGaming: inicio de sesión automático (Plasma Login Manager, Bazzite).
# Al prender la PC entra sola al escritorio y arrancan Sunshine y el panel, que son
# servicios de usuario. La sesión se bloquea enseguida (config/autostart) y se
# desbloquea sola durante los streams (scripts/cloudgaming-vmon-start).
# Instalar en /etc/plasmalogin.conf.d/10-cloudgaming-autologin.conf (necesita sudo).
[Autologin]
# Poné tu usuario de Linux (el que muestra «whoami»).
User=tu-usuario
Session=plasma.desktop
