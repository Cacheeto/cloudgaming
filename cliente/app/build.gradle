apply plugin: 'com.android.application'

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        // CloudGaming: build for a modern phone (arm64) and a TV
        // (Android TV, 32-bit arm); build-cloudgaming.sh makes one APK for each.
        minSdk 26
        targetSdk 36

        // CloudGaming 2.x, based on Moonlight 12.2. versionCode must keep growing to update.
        versionName "3.6"
        versionCode = 14

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
        // arm64 for the phone; -PcloudgamingAbis=armeabi-v7a for the TV, x86_64 for the emulator.
        def abis = (project.findProperty('cloudgamingAbis') ?: 'arm64-v8a').split(',')
        ndk.abiFilters(*abis)
        // The file the panel offers to update this same build (see Menu.ApiJs.apk).
        buildConfigField "String", "CLOUDGAMING_APK",
            abis.contains('armeabi-v7a') ? '"cloudgaming-tv.apk"' : '"cloudgaming.apk"'
    }

    signingConfigs {
        // Same key as the original CloudGaming app, so Android accepts it as an update.
        // It lives outside the repo; see ~/.local/share/cloudgaming-app.
        def firma = new File(System.getProperty('user.home'), '.local/share/cloudgaming-app')
        if (new File(firma, 'firma.p12').exists()) {
            cloudgaming {
                storeFile new File(firma, 'firma.p12')
                storeType 'PKCS12'
                storePassword new File(firma, 'clave').text.readLines()[0]
                keyAlias 'cloudgaming'
                keyPassword new File(firma, 'clave').text.readLines()[0]
            }
        }
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.limelight.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot", "-j6"
                }
            }

            applicationId "ar.cloudgaming.app"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "CloudGaming (Debug)"
            resValue "string", "app_label_root", "CloudGaming (Root Debug)"
        }
        release {
            // CloudGaming: no ".unofficial" suffix needed, the applicationId is already our own
            // (ar.cloudgaming.app), not Moonlight's.
            resValue "string", "app_label", "CloudGaming"
            resValue "string", "app_label_root", "CloudGaming (Root)"
            if (signingConfigs.findByName('cloudgaming') != null) {
                signingConfig signingConfigs.cloudgaming
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    // CloudGaming: the Tailscale engine (libtailscale), built by red-cloudgaming.sh.
    implementation files('libs/libtailscale.aar')
    // CloudGaming: QR code for signing in from the TV, which has no browser (MIT)
    implementation 'io.nayuki:qrcodegen:1.8.0'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
